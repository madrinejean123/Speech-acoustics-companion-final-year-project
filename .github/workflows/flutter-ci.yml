name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "frontend-flutter/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend-flutter/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend-flutter

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

  build-android:
    name: Build Android APK (split per ABI)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: frontend-flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-web:
    name: Build web
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --base-href /Speech-acoustics-companion-final-year-project/

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend-flutter/build/web
          if-no-files-found: error

  deploy-web:
    name: Deploy web to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

      - id: deployment
        uses: actions/deploy-pages@v4
